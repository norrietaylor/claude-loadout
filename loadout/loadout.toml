# Claude Code for min sessions: sandbox-correct settings, the project's recent
# session history in (and new transcripts back out, via host.zsh), and
# auto memory backed by a git repo you choose, with a keep/discard review.
#
# Stack after `broker` (`--loadout broker --loadout claude`): broker supplies
# Claude auth and the github.com rewrite the memory clone and push go through.
#
# Everything personal arrives as a host env var, set by host.zsh; with none
# set, this falls back to stock ~/.claude and leaves memory sync off. Path
# vars are relative to your host home.
description = "Claude Code: sandbox settings, project history in/out, git-synced memory review"

packages = ["claude", "git", "jq"]

# Symlinks are not followed (a skills tree with a link back to its own
# parent would loop). If your ~/.claude/skills is a farm of links into a
# config repo, point CLAUDE_LOADOUT_SKILLS at the repo's skills dir instead.
follow_symlinks = false

patches = [
  { dest = ".claude/CLAUDE.md",       source = "~/$CLAUDE_LOADOUT_CLAUDE_MD" },
  { dest = ".claude/settings.json",   source = "~/$CLAUDE_LOADOUT_SETTINGS" },
  { dest = ".claude/output-styles/",  source = "~/$CLAUDE_LOADOUT_OUTPUT_STYLES" },
  { dest = ".claude/skills/",         source = "~/$CLAUDE_LOADOUT_SKILLS" },
  { dest = ".claude/skills/memories/", source = "$LOADOUT_ROOT/skills/memories" },
  { dest = ".claude/statusline.sh",   source = "$LOADOUT_ROOT/statusline.sh" },
  { dest = ".local/bin/",             source = "$LOADOUT_ROOT/bin/claude-*" },
  { dest = ".local/bin/",             source = "$LOADOUT_ROOT/session-bin/*" },
  { dest = ".config/claude-loadout/shellrc.sh", source = "$LOADOUT_ROOT/shellrc.sh" },

  # Recent transcripts for this project, staged by `claude-sessions stage`
  # with their cwd rewritten to /workbench.
  { dest = ".claude/projects/-workbench/", source = "~/.local/state/claude-loadout/stage/$CLAUDE_LOADOUT_SLUG/*.jsonl" },

  # The host's memories for this project: only used when memory sync is off
  # (no remote) or the clone fails, so the session still starts informed.
  { dest = ".config/claude-loadout/seed-memory/", source = "~/.claude/projects/$CLAUDE_LOADOUT_SLUG/memory/*.md" },
]

[vars]
CLAUDE_LOADOUT_IN_SESSION    = "1"
CLAUDE_LOADOUT_SLUG          = { inherit = true, default = "none" }
CLAUDE_LOADOUT_MEMORY_REMOTE = { inherit = true, default = "" }
CLAUDE_LOADOUT_MEMORY_SUBDIR = { inherit = true, default = "memory" }
CLAUDE_LOADOUT_CLAUDE_MD     = { inherit = true, default = ".claude/CLAUDE.md" }
CLAUDE_LOADOUT_SETTINGS      = { inherit = true, default = ".config/minimal/loadouts/claude/settings.default.json" }
CLAUDE_LOADOUT_OUTPUT_STYLES = { inherit = true, default = ".claude/output-styles" }
CLAUDE_LOADOUT_SKILLS        = { inherit = true, default = ".claude/skills" }
# "1" pre-accepts the workspace trust prompt for /workbench.
CLAUDE_LOADOUT_TRUST_WORKBENCH = { inherit = true, default = "" }

[[lifecycle_hooks]]
description = "claude: memory repo + link, onboarding/trust, plugins"
on_activate = { type = "external", value = "./hooks/on-activate.sh", timeout = 240 }

[[lifecycle_hooks]]
description = "claude: send kept and unreviewed memories to pending/<session>/<slug>"
on_detach  = { type = "external", value = "./hooks/on-teardown.sh", timeout = 45 }
on_destroy = { type = "external", value = "./hooks/on-teardown.sh", timeout = 45 }
